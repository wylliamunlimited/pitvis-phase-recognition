[package]
name = "pitvis-serve"
version = "0.1.0"
edition = "2021"
description = "Inference for PitVis step and instrument recognition, without a Python runtime"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
