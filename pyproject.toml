[project]
name = "pitvis-phase-recognition"
version = "0.1.0"
description = "Surgical step (phase) recognition on the PitVis dataset"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.5",
    "timm>=1.0",
    "torch>=2.4",
    "torchvision>=0.19",
]

# CLI surface. Each script maps to the `main()` of one module, so the commands
# and the import graph cannot drift apart.
[project.scripts]
# Per-package workflow runners — each runs one directory end to end.
pitvis-data = "pitvis.data.run:main"
pitvis-models = "pitvis.models.run:main"
pitvis-train = "pitvis.training.run:main"
pitvis-eval = "pitvis.evaluation.run:main"
pitvis-predict = "pitvis.inference.run:main"
pitvis-export = "pitvis.inference.export:main"
pitvis-app = "pitvis.app.run:main"
# Individual data stages. The runners above call these same main()s, never a
# copy. Models are NOT listed here — they live in training/registry.py and are
# reached as `pitvis-train <name>`, so adding one needs no pyproject edit.
pitvis-inventory = "pitvis.data.inventory:main"
pitvis-extract = "pitvis.data.extract_features:main"
pitvis-verify = "pitvis.data.verify_cache:main"
pitvis-frames = "pitvis.data.extract_frames:main"
pitvis-finetune = "pitvis.training.backbone:main"
pitvis-probe = "pitvis.evaluation.probe:main"

# A CUDA host needs torch from NVIDIA's index rather than default PyPI.
# Uncomment both blocks on a GPU box; the default (CPU + MPS) build is what
# every Mac in this project uses and must stay the default.
#
# [[tool.uv.index]]
# name = "pytorch-cu124"
# url = "https://download.pytorch.org/whl/cu124"
# explicit = true
#
# [tool.uv.sources]
# torch = { index = "pytorch-cu124" }
# torchvision = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitvis"]

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "onnxscript>=0.7.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# `pitvis` is installed editable into .venv, so tests import it exactly as the
# entry points do. No sys.path manipulation.
testpaths = ["tests"]
