<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PitVis — case review</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- data-detail toggles the analyst layer. Default OFF: the interface answers
     "what is happening now" and nothing else. Everything that answers "how did
     the model do" is hidden until asked for. -->
<div id="app" data-state="loading">

  <header class="bar">
    <span class="mark">PITVIS</span>
    <label class="picker">
      <select id="case-select"></select>
    </label>
    <span class="split" id="split"></span>
    <span class="prov" id="prov"></span>
    <span class="grow"></span>
    <button id="detail-toggle" class="ghost" aria-pressed="false">+ DETAIL</button>
    <span class="chip warn" title="This renders research model output on recorded video. It is not a medical device and must not inform clinical decisions.">RESEARCH — NOT FOR CLINICAL USE</span>
  </header>

  <main>
    <section class="stage">
      <div class="frame brk" id="frame">
        <video id="video" preload="metadata" playsinline></video>
        <!-- Seam (a): the agentic explanation layer draws here. Sized to the
             video's displayed rect, empty until something registers a layer.
             The burn-in below sits ABOVE this canvas and never draws into it —
             the canvas works in video pixels, burn-in text works in screen
             pixels, and mixing the two would ruin the layer registry before it
             has a layer. -->
        <canvas id="overlay"></canvas>

        <!-- Burned into the image, PACS convention. Positioned against the
             VIDEO rect, not the frame: the video letterboxes, so at 1440x900
             there are ~54px of paper above and below it. -->
        <div class="burn" id="burn">
          <div class="corner tl">
            <span class="id" id="b-case">--</span>
            <span class="sub" id="b-split"></span>
            <span class="sub warn">RESEARCH — NOT FOR CLINICAL USE</span>
          </div>
          <div class="corner tr">
            <span class="id" id="b-clock">--:--:-- / --:--:--</span>
          </div>
          <div class="corner bl">
            <span class="step" id="b-step">--</span>
          </div>
          <div class="corner br">
            <span class="inst" id="b-inst">--</span>
          </div>
        </div>

        <div class="veil" id="veil"><span></span></div>
      </div>

      <div class="transport">
        <button id="play" class="wide">PLAY</button>
        <button id="back10" title="back 10s (shift+left)">&laquo;</button>
        <button id="fwd10" title="forward 10s (shift+right)">&raquo;</button>
        <span class="tsep"></span>
        <button id="prevseg" title="previous step ([)">&lsaquo; STEP</button>
        <button id="nextseg" title="next step (])">STEP &rsaquo;</button>
        <span class="grow"></span>
        <button id="rerun" class="ghost more">RE-RUN</button>
      </div>
    </section>

    <aside class="rail">

      <div class="tiles" id="tiles">
        <div class="tile brk">
          <span class="cap">STEP</span>
          <span class="v" id="t-step">--</span>
          <span class="u" id="t-elapsed">--:--</span>
        </div>
        <div class="tile brk">
          <span class="cap">STEPS SEEN</span>
          <span class="v" id="t-seen">--</span>
          <span class="u">of 14</span>
        </div>
        <div class="tile brk more">
          <span class="cap">CONFIDENCE</span>
          <span class="v" id="t-conf">--</span>
          <span class="u" id="t-conf-note"></span>
        </div>
      </div>

      <section class="card brk" id="worklist-card">
        <div class="cap">PROCEDURE STEPS</div>
        <ol class="worklist" id="worklist"></ol>
        <div class="wl-foot" id="wl-foot"></div>
      </section>

      <section class="card brk more" id="inst-card">
        <div class="cap">INSTRUMENT USE</div>
        <ul class="tray" id="tray"></ul>
        <div class="tray-foot" id="tray-foot"></div>
      </section>

      <section class="card brk more" id="ref-card">
        <div class="cap">GROUND TRUTH</div>
        <div id="ref-body"></div>
      </section>

      <section class="card brk more" id="alt-card" hidden>
        <div class="cap">POST-PROCESSING</div>
        <div class="alt" id="step-alt"></div>
      </section>

    </aside>
  </main>

  <footer class="timeline" id="timeline">
    <div class="lane-labels" id="lane-labels"></div>
    <div class="track" id="track">
      <canvas id="tl-canvas"></canvas>
      <div class="playhead" id="playhead"></div>
      <div class="hover" id="tl-hover" hidden></div>
    </div>
  </footer>

  <div class="console brk" id="console" hidden>
    <div class="cap">INFERENCE<button id="console-close" class="ghost">CLOSE</button></div>
    <pre id="console-log"></pre>
  </div>

  <div class="boot" id="boot"><span>LOADING</span></div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
