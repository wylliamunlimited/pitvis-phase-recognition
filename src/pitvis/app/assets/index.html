<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PitVis — case review</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- data-detail toggles the analyst layer. Default OFF: the interface answers
     "what is happening now" and nothing else. Everything that answers "how did
     the model do" is hidden until asked for. -->
<div id="app" data-state="loading">

  <header class="bar">
    <span class="mark">PITVIS</span>
    <label class="picker">
      <select id="case-select"></select>
    </label>
    <span class="split more" id="split"></span>
    <span class="prov" id="prov"></span>
    <span class="grow"></span>
    <button id="layout-reset" class="ghost" title="return every panel to its default position and open state">RESET LAYOUT</button>
    <button id="detail-toggle" class="ghost" aria-pressed="false">+ DETAIL</button>
    <span class="chip warn" title="This renders research model output on recorded video. It is not a medical device and must not inform clinical decisions.">RESEARCH — NOT FOR CLINICAL USE</span>
  </header>

  <main>
    <section class="stage">
      <div class="frame brk" id="frame">
        <video id="video" preload="metadata" playsinline></video>
        <!-- Seam (a): the agentic explanation layer draws here. Sized to the
             video's displayed rect, empty until something registers a layer.
             The burn-in below sits ABOVE this canvas and never draws into it —
             the canvas works in video pixels, burn-in text works in screen
             pixels, and mixing the two would ruin the layer registry before it
             has a layer. -->
        <canvas id="overlay"></canvas>

        <!-- Burned into the image, PACS convention. Positioned against the
             VIDEO rect, not the frame: the video letterboxes, so at 1440x900
             there are ~54px of paper above and below it. -->
        <div class="burn" id="burn">
          <!-- Case identity only. The split is analyst vocabulary and lives
               behind DETAIL now; the disclaimer is stated once, in the header,
               rather than twice. Three lines here also collided with the left
               panel column, which is what made the duplication visible. -->
          <div class="corner tl">
            <span class="id" id="b-case">--</span>
            <span class="sub more" id="b-split"></span>
          </div>
          <div class="corner tr">
            <span class="id" id="b-clock">--:--:-- / --:--:--</span>
          </div>
          <div class="corner bl">
            <span class="step" id="b-step">--</span>
          </div>
          <div class="corner br">
            <span class="inst" id="b-inst">--</span>
          </div>
        </div>

        <div class="veil" id="veil"><span></span></div>
      </div>

      <div class="transport">
        <button id="play" class="wide">PLAY</button>
        <button id="back10" title="back 10s (shift+left)">&laquo;</button>
        <button id="fwd10" title="forward 10s (shift+right)">&raquo;</button>
        <span class="tsep"></span>
        <button id="prevseg" title="previous step ([)">&lsaquo; STEP</button>
        <button id="nextseg" title="next step (])">STEP &rsaquo;</button>
        <span class="grow"></span>
        <button id="rerun" class="ghost more">RE-RUN</button>
      </div>
    </section>

    <!-- Floating panel layer. Each panel is independently collapsible and
         draggable, so two categories can be open side by side instead of
         stacked in a column that has to be scrolled. Defaults park them on the
         pillarbox paper either side of the video. The layer itself is
         pointer-transparent; only the panels take events. -->
    <div class="panels" id="panels">

      <!-- Collapsed by default, and deliberately: STEP and elapsed time are
           already burned into the frame corners, so expanded it mostly repeats
           the image. Folding it hands the whole left column to PROCEDURE STEPS,
           which is the panel that actually needs the height — all fourteen rows
           fit with nothing to scroll. One click gets STEPS SEEN back. -->
      <section class="panel brk" data-panel="status" data-side="left" data-top="0"
               data-collapsed>
        <header class="phead">
          <span class="cap">STATUS</span>
          <button class="fold" aria-expanded="false" title="expand (1)"></button>
        </header>
        <div class="pbody">
          <div class="tiles" id="tiles">
            <div class="tile">
              <span class="cap">STEP</span>
              <span class="v" id="t-step">--</span>
              <span class="u" id="t-elapsed">--:--</span>
            </div>
            <div class="tile">
              <span class="cap">STEPS SEEN</span>
              <span class="v" id="t-seen">--</span>
              <span class="u">of 14</span>
            </div>
            <div class="tile more">
              <span class="cap">CONFIDENCE</span>
              <span class="v" id="t-conf">--</span>
              <span class="u" id="t-conf-note"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel brk" id="worklist-card" data-panel="steps" data-side="left" data-top="1">
        <header class="phead">
          <span class="cap">PROCEDURE STEPS</span>
          <button class="fold" aria-expanded="true" title="collapse (2)"></button>
        </header>
        <div class="pbody">
          <ol class="worklist" id="worklist"></ol>
          <div class="wl-foot" id="wl-foot"></div>
        </div>
      </section>

      <section class="panel brk more" data-panel="instruments" data-side="right" data-top="0">
        <header class="phead">
          <span class="cap">INSTRUMENT USE</span>
          <button class="fold" aria-expanded="true" title="collapse (3)"></button>
        </header>
        <div class="pbody">
          <ul class="tray" id="tray"></ul>
          <div class="tray-foot" id="tray-foot"></div>
        </div>
      </section>

      <section class="panel brk more" data-panel="truth" data-side="right" data-top="1">
        <header class="phead">
          <span class="cap">GROUND TRUTH</span>
          <button class="fold" aria-expanded="true" title="collapse (4)"></button>
        </header>
        <div class="pbody"><div id="ref-body"></div></div>
      </section>

      <section class="panel brk more" id="alt-card" data-panel="post" data-side="right" data-top="2" hidden>
        <header class="phead">
          <span class="cap">POST-PROCESSING</span>
          <button class="fold" aria-expanded="true" title="collapse (5)"></button>
        </header>
        <div class="pbody"><div class="alt" id="step-alt"></div></div>
      </section>

    </div>
  </main>

  <footer class="timeline" id="timeline">
    <div class="lane-labels" id="lane-labels"></div>
    <div class="track" id="track">
      <canvas id="tl-canvas"></canvas>
      <div class="playhead" id="playhead"></div>
      <div class="hover" id="tl-hover" hidden></div>
    </div>
  </footer>

  <div class="console brk" id="console" hidden>
    <div class="cap">INFERENCE<button id="console-close" class="ghost">CLOSE</button></div>
    <pre id="console-log"></pre>
  </div>

  <div class="boot" id="boot"><span>LOADING</span></div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
